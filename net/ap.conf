# DSChat access point configuration.
# Read (sourced) by net/ap-up.sh / ap-down.sh and parsed by relay/relay.py.
# Plain KEY=value lines only.

# Interface that carries the laptop's internet (e.g. a phone hotspot joined
# over Wi-Fi). auto = the interface of the default route (net/iface.sh).
# If it is the same as WIFI_IFACE, the AP runs concurrently on the same radio
# and MUST use the channel this interface is connected on (most cards allow
# only one channel at a time). Fallback: USB tethering -> the upstream is the
# USB interface (e.g. usb0 / enx...) and the AP uses AP_CHANNEL instead.
UPSTREAM_IFACE=auto

# Physical Wi-Fi interface whose radio hosts the virtual AP interface.
# auto = the (connected) managed Wi-Fi interface; set a name to override.
WIFI_IFACE=auto

# Virtual AP interface created by ap-up.sh (removed by ap-down.sh).
AP_IFACE=dsap0

# Visible, short ASCII SSID (open or WEP: see net/dschat.conf).
AP_SSID=DSCHAT

# Only used when UPSTREAM_IFACE != WIFI_IFACE (no concurrent station).
AP_CHANNEL=6

# Own subnet for the DS. Must not overlap your other networks (the hotspot's,
# Docker's, a VPN's...).
# ap-up.sh refuses to start if any existing route overlaps it.
AP_ADDR=192.168.77.1
AP_PREFIX=24
DHCP_START=192.168.77.10
DHCP_END=192.168.77.50
DHCP_LEASE=12h

# TCP port of the relay; the AP firewall opens only this port and DHCP.
# Keep in sync with PORT in relay/.env (the relay warns if they differ).
RELAY_PORT=4242

# Optional MAC allowlist, one MAC per line (# comments allowed), path relative
# to the repo root. Missing or empty file = allow every station. Template:
# net/allowed_macs.example.txt (copy it to net/allowed_macs.txt, gitignored).
MAC_ALLOWLIST=net/allowed_macs.txt
